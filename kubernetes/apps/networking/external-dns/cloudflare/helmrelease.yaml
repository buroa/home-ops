---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  interval: 1h
  values:
    controllers:
      external-dns-cloudflare:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.k8s.io/external-dns/external-dns
              tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
            args:
              - --cloudflare-dns-records-per-page=1000
              - --cloudflare-proxied
              - --domain-filter=k13.dev
              - --events
              - --gateway-name=envoy-external
              - --interval=1m
              - --log-format=text
              - --log-level=info
              - --policy=sync
              - --provider=cloudflare
              - --registry=txt
              - --source=gateway-httproute
              - --txt-owner-id=k8s
              - --txt-prefix=k8s.%{record_type}-
              - --zone-id-filter=$(CF_ZONE_ID)
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7979
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        serviceAccount:
          name: external-dns-cloudflare
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
